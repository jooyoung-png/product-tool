name: Monthly Data Update

on:
  schedule:
    # 매월 1일 00:00 UTC = 09:00 KST
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: TOP PRODUCT 파일 갱신
        env:
          TOPPRODUCT_SESSION_ID: ${{ secrets.TOPPRODUCT_SESSION_ID }}
        run: node scripts/export-top-products.mjs

      - name: 과거 판매가 이력 갱신 (Mixpanel)
        env:
          MIXPANEL_API_SECRET: ${{ secrets.MIXPANEL_API_SECRET }}
        run: |
          node scripts/export-mixpanel.mjs data/price_history.csv
          node scripts/compute-price-stats.mjs data/price_history.csv

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.csv data/meta.json data/price_stats.json
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 스킵"
          else
            git commit -m "chore: 월간 데이터 자동 업데이트 ($(date +%Y-%m-%d))"
            git push
          fi
